[package]
name = "thugz-swap"
version = "0.1.0"
description = "Thugz Swap — one-way redemption desk: a 2021 original for its reminted twin"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "thugz_swap"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Substitutes committed fixture keypairs for ADMIN/CUSTODIAN so the test suite can
# sign as them. NEVER enabled for the mainnet build — the verified build is default
# features, and CI asserts the deployed artifact was built without this.
test-keys = []

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"

[dev-dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
litesvm = "0.10.0"
litesvm-token = "0.10.0"
solana-instruction = "3"
solana-transaction-error = "3"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3"
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
