[package]
name = "rehearsal-driver"
version = "0.1.0"
description = "Phase 4 Surfpool rehearsal tooling — MAINNET constants (no test-keys feature)"
edition.workspace = true
rust-version.workspace = true

[dependencies]
thugz-swap = { path = "../../programs/thugz-swap", features = ["no-entrypoint"] }
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
solana-rpc-client = "3"
solana-commitment-config = "3"
solana-keypair = "3"
solana-signer = "3"
solana-message = "3"
solana-transaction = "3"
solana-instruction = "3"
solana-transaction-error = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
spl-token-interface = "2"
spl-associated-token-account-interface = "2"
serde_json = "1"
solana-rpc-client-api = "3"
solana-signature = "3"
bincode = "1"

[[bin]]
name = "deposit_run"
path = "src/bin/deposit_run.rs"

[[bin]]
name = "swap_battery"
path = "src/bin/swap_battery.rs"

[[bin]]
name = "stage2_ops"
path = "src/bin/stage2_ops.rs"
